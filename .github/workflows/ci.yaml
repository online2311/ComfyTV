name: CI

on:
  pull_request:
    branches: [main, master, alpha/drama-pipeline]
  push:
    branches: [main, master, alpha/drama-pipeline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    env:
      # Chunk render of js/assets/main-*.mjs exceeds Node's default ~2GB heap.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Test with coverage (enforces thresholds)
        run: npm run test:coverage

      - name: Build (vite)
        run: npm run build

      # Production git-pulls the branch and serves js/ with no build step.
      # Vite empties js/ and rewrites it, including hashed chunks, so a clean
      # tree here means the committed bundle matches this source. Two local
      # builds were byte-identical (Node 20, Linux). Sourcemaps embed source
      # text, so a Windows checkout can still differ by CRLF.
      - name: Fail if committed js/ bundle is stale
        run: |
          if [ -n "$(git status --porcelain -- js)" ]; then
            echo "js/ does not match npm run build. Rebuild and commit js/."
            git status --porcelain -- js
            git diff --stat -- js
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # apt-get update on the runner can stall the job. Install from the image
      # index, and refresh that index only when the install cannot proceed.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          if ! sudo apt-get install -y -o Acquire::Retries=3 ffmpeg; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 ffmpeg
          fi

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov aiohttp sqlalchemy av pillow numpy pyyaml imageio-ffmpeg

      - name: Run pytest (geometry coverage gate)
        # The mesh3d algorithm tier importorskips torch and is skipped here (same
        # pattern as the existing torch-gated tests); those files then stay out of
        # the coverage report, so the CI gate covers the orchestration layer while
        # a local torch run measures the full set with the same command.
        # test_anlmdn aborts the interpreter inside PyAV after it passes
        # (heap corruption). Keep it out of the process.
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=80 --deselect tests/test_fx_coverage.py::TestAudioDenoiseBranches::test_anlmdn

  python-no-path-ffmpeg:
    name: Python (concat without PATH ffmpeg)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio aiohttp sqlalchemy av pillow numpy pyyaml imageio-ffmpeg

      - name: Hide ffmpeg and ffprobe on PATH
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          blocked = {"ffmpeg", "ffprobe"}
          shadow_root = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "path-without-ffmpeg"
          shadow_root.mkdir(parents=True, exist_ok=True)
          kept = []
          for entry in os.environ.get("PATH", "").split(os.pathsep):
              if not entry:
                  continue
              directory = Path(entry)
              if not directory.is_dir():
                  kept.append(entry)
                  continue
              try:
                  names = list(directory.iterdir())
              except OSError:
                  kept.append(entry)
                  continue
              if not any(path.name in blocked for path in names):
                  kept.append(entry)
                  continue
              replacement = shadow_root / str(len(kept))
              replacement.mkdir()
              for path in names:
                  if path.name in blocked or not path.is_file():
                      continue
                  dest = replacement / path.name
                  if not dest.exists():
                      dest.symlink_to(path)
              kept.append(str(replacement))
          path = os.pathsep.join(kept)
          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as handle:
              handle.write("PATH<<__PATH_EOF__\n")
              handle.write(path + "\n")
              handle.write("__PATH_EOF__\n")
          PY

      - name: Assert ffmpeg and ffprobe are absent
        run: |
          if command -v ffmpeg || command -v ffprobe; then
            echo "ffmpeg or ffprobe is still on PATH"
            exit 1
          fi
          python -c "import imageio_ffmpeg, av; print(imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Run concat tests
        run: python -m pytest tests/test_ffmpeg_concat.py -q --tb=short
