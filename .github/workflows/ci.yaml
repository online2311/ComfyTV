name: CI

on:
  pull_request:
    branches: [main, master, alpha/drama-pipeline]
  push:
    branches: [main, master, alpha/drama-pipeline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    env:
      # Chunk render of js/assets/main-*.mjs exceeds Node's default ~2GB heap.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Test with coverage (enforces thresholds)
        run: npm run test:coverage

      - name: Build (vite)
        run: npm run build

      # Production git-pulls the branch and serves js/ with no build step.
      # Vite empties js/ and rewrites it, including hashed chunks, so a clean
      # tree here means the committed bundle matches this source. Two local
      # builds were byte-identical (Node 20, Linux). Sourcemaps embed source
      # text, so a Windows checkout can still differ by CRLF.
      - name: Fail if committed js/ bundle is stale
        run: |
          if [ -n "$(git status --porcelain -- js)" ]; then
            echo "js/ does not match npm run build. Rebuild and commit js/."
            git status --porcelain -- js
            git diff --stat -- js
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov aiohttp sqlalchemy av pillow numpy pyyaml

      - name: Run pytest (geometry coverage gate)
        # The mesh3d algorithm tier importorskips torch and is skipped here (same
        # pattern as the existing torch-gated tests); those files then stay out of
        # the coverage report, so the CI gate covers the orchestration layer while
        # a local torch run measures the full set with the same command.
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=80
